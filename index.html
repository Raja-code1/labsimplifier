<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LabSimplifier — Premium Lab Practical Portal</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Practise your lab practical as if you were at the real bench.">
  <link rel="stylesheet" href="style.css">
  <!-- Theme applied before paint to avoid flash -->
  <script>
    try {
      const t = localStorage.getItem('ls_theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch(e) {}
  </script>
</head>
<body>
  <div id="app">
    <div id="view"></div>
  </div>
  <nav id="bottom-nav" hidden>
    <button data-nav="home" aria-label="Home"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></button>
    <button data-nav="labs" aria-label="Labs"><span class="nav-icon">⚗</span><span class="nav-label">Labs</span></button>
    <button data-nav="profile" aria-label="Profile"><span class="nav-icon">☺</span><span class="nav-label">Profile</span></button>
    <button data-nav="support" aria-label="Support"><span class="nav-icon">?</span><span class="nav-label">Support</span></button>
  </nav>
  <script src="config.js"></script>
  <script src="simulation.js"></script>
  <script src="app.js"></script>
</body>
</html>
